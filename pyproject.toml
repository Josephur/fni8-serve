[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fni8-serve"
# 0.1.0: first tagged release of the serving spine (engine + converter + loader +
# the 8 model families + OpenAI API). Bumped off the placeholder 0.0.1. The `.fni8`
# checkpoint format version is a SEPARATE number carried in the file header by the
# fni8 reader (see loader.checkpoint_info) — it is NOT derived from this package
# version, so the two move independently.
version = "0.1.0"
description = "W8A8 (INT8 dp4a) inference server for Volta / CMP 100-210, over the fni8 kernels"
readme = "README.md"
# == 3.12.* to match fni8 exactly: the Volta stack is the cp312 torch wheel, so
# 3.13+ would resolve a wheel that can't target sm_70. Do not loosen.
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "fni8-serve authors" }]

# Pinned to the last Volta-capable stack (matches fni8). NO flash-attn (fp16 path is
# the gimped-tensor-core baseline we deliberately avoid on this fleet).
# NOTE: torch MUST be the +cu129 build (sm_70). It comes from the fni8 Docker base;
# for a bare install use the cu129 index:
#   pip install torch==2.10.0+cu129 --index-url https://download.pytorch.org/whl/cu129
# The bare `torch==2.10.0` below is intentional so `pip install` works from either the
# cu129 index or the Docker base; it is NOT a plain-PyPI CPU/cu-mismatched torch.
# A naive `pip install` that resolves the wrong build (e.g. +cpu) is caught at import
# time by `fni8serve._check_torch_build()` (raises a clear ImportError), so it can
# never silently run on a torch that lacks the sm_70 dp4a kernels.
dependencies = [
  "torch==2.10.0",
  "numpy",
  # llama.cpp's own GGUF reader + block dequant — backs the native-GGUF load path
  # (fni8serve.gguf_native) and the GGUF→.fni8 importer (fni8serve.gguf_import).
  "gguf",
  # fni8 supplies the sm_70 dp4a kernels this server is built on. It is NOT on PyPI:
  # the Docker base (fni8-built:sm70) provides it as an editable install at /opt/fni8,
  # which satisfies this bare requirement (pip leaves the existing install in place).
  # For a non-Docker install, get it first from the sibling repo:
  #   pip install -e ../fused_ni8      # or: pip install "fni8 @ git+https://github.com/jajmangold/fni8"
  # (declared here so the dependency is explicit; see the `kernels` extra for the VCS pin.)
  "fni8",
]

[project.optional-dependencies]
# Non-Docker install of the fni8 kernels straight from the VCS (Docker users already
# have the editable /opt/fni8 install, so they never need this). torch must ALREADY
# be the +cu129 build before this builds against it.
kernels = ["fni8 @ git+https://github.com/jajmangold/fni8"]
dev = ["pytest", "ruff", "openai", "httpx", "xgrammar", "jsonschema"]
# Only the HF-checkpoint conversion path (fni8serve.convert.convert_hf_to_fni8)
# needs these; serving from a .fni8 file does not.
convert = ["safetensors", "huggingface-hub"]
# The OpenAI-compatible API server (fni8serve.api). transformers supplies the
# tokenizer + apply_chat_template; the .fni8 file itself carries no tokenizer.
# pillow + torchvision back the VLM image path (HF AutoImageProcessor needs torchvision).
# torchvision must be the +cu129 build matching torch 2.10.0 — from the fni8 Docker base,
# or: pip install torchvision==0.25.0+cu129 --index-url https://download.pytorch.org/whl/cu129
serve = ["fastapi>=0.110", "uvicorn[standard]", "transformers", "python-multipart", "pillow", "torchvision==0.25.0", "rich>=13.0", "nvidia-ml-py"]
# Structured outputs / grammars (fni8serve.structured, issue #39): `response_format=
# {"type": "json_schema"}` and the `grammar` (GBNF/EBNF) extension. Pure-Python/CPU --
# XGrammar's token-mask matcher needs no CUDA, just the sampler's logit-processor hook.
structured = ["xgrammar"]

[project.scripts]
# Live terminal dashboard for a running server (issue #182). Polls GET /metrics.
fni8serve-top = "fni8serve.tui:main"

[tool.setuptools.packages.find]
include = ["fni8serve*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# __init__.py runs `_check_torch_build()` before the re-exports so a wrong torch
# build fails loudly at import time, before any submodule touches a kernel — this
# necessarily puts those imports below a statement (E402).
"fni8serve/__init__.py" = ["E402"]
