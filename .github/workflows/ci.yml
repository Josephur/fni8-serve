name: CI

# Required gate for fni8-serve PRs. serve is PURE PYTHON — it only *imports* fni8's
# compiled kernels, it never rebuilds them. So instead of cloning + nvcc-compiling fni8
# on every PR (~35 min, the old flow, and the source of the concurrent-build OOMs), we
# run against the prebuilt `fni8-built:sm70` image (fni8 baked in, refreshed on each
# fni8-master merge). ~3 min, no nvcc → many serve PRs can test concurrently without
# ever touching the box's compile budget. Branch protection makes `build-test` mandatory.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:                       # <- required status check name; keep it
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: serve

      - name: Test against prebuilt fni8 (light lane — no nvcc)
        run: |
          # fni8-built:sm70 has fni8 already installed (editable at /opt/fni8). If it's
          # somehow absent on this runner, fall back to building it once from a fresh
          # clone so CI is self-healing rather than hard-failing.
          if ! docker image inspect fni8-built:sm70 >/dev/null 2>&1; then
            echo "::warning::fni8-built:sm70 missing — building it once (slow path)"
            rm -rf "$GITHUB_WORKSPACE/fni8"
            git clone --depth 1 https://github.com/jajmangold/fni8 "$GITHUB_WORKSPACE/fni8"
            docker build -f "$GITHUB_WORKSPACE/fni8/docker/Dockerfile.built" \
              -t fni8-built:sm70 "$GITHUB_WORKSPACE/fni8"
          fi
          docker run --rm --gpus all \
            -e PYTHONPATH="$GITHUB_WORKSPACE/serve" \
            -v "$GITHUB_WORKSPACE/serve:$GITHUB_WORKSPACE/serve" \
            -w "$GITHUB_WORKSPACE/serve" \
            fni8-built:sm70 bash -lc '
              set -e
              pip install -e ".[dev,convert,serve,structured]" --no-build-isolation -q
              pytest -q
            '
