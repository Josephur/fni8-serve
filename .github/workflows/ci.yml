name: CI

# Required gate for fni8-serve PRs. serve is PURE PYTHON — it only *imports* fni8's
# compiled kernels, it never rebuilds them. So instead of cloning + nvcc-compiling fni8
# on every PR (~35 min, the old flow, and the source of the concurrent-build OOMs), we
# run against the prebuilt `fni8-built:sm70` image (fni8 baked in, refreshed on each
# fni8-master merge). A GitHub-hosted classifier keeps documentation/CI-only changes off
# the Volta queue entirely. Branch protection keeps the aggregate `build-test` mandatory.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '*.py'
              - 'fni8serve/**'
              - 'tests/**'
              - 'bench/**'
              - 'examples/**'
              - 'scripts/**'
              - 'tools/**'
              - 'docker/**'
              - 'pyproject.toml'

  runtime-test:
    name: serving tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: serve

      - name: Test against prebuilt fni8 (light lane — no nvcc)
        run: |
          # fni8-built:sm70 has fni8 already installed (editable at /opt/fni8). If it's
          # somehow absent on this runner, fall back to building it once from a fresh
          # clone so CI is self-healing rather than hard-failing.
          if ! docker image inspect fni8-built:sm70 >/dev/null 2>&1; then
            echo "::warning::fni8-built:sm70 missing — building it once (slow path)"
            rm -rf "$GITHUB_WORKSPACE/fni8"
            git clone --depth 1 https://github.com/jajmangold/fni8 "$GITHUB_WORKSPACE/fni8"
            docker build -f "$GITHUB_WORKSPACE/fni8/docker/Dockerfile.built" \
              -t fni8-built:sm70 "$GITHUB_WORKSPACE/fni8"
          fi
          docker run --rm --gpus all \
            -e PYTHONPATH="$GITHUB_WORKSPACE/serve" \
            -v "$GITHUB_WORKSPACE/serve:$GITHUB_WORKSPACE/serve" \
            -w "$GITHUB_WORKSPACE/serve" \
            fni8-built:sm70 bash -lc '
              set -e
              pip install -e ".[dev,convert,serve,structured]" --no-build-isolation -q
              # torchvision (VLM image path) must match the baked torch 2.10.0+cu129 ABI;
              # --no-deps so it never disturbs the baked torch. PyPI torchvision would risk
              # a cu-mismatch, so pull the exact cu129 build from the pytorch index.
              pip install --no-deps torchvision==0.25.0+cu129 \
                --index-url https://download.pytorch.org/whl/cu129 -q
              pytest -q
            '

  build-test:
    name: build-test
    needs: [changes, runtime-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required gate
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RUNTIME_RESULT: ${{ needs.runtime-test.result }}
        run: |
          test "$CHANGE_RESULT" = success
          if [ "$CODE_CHANGED" = true ]; then
            test "$RUNTIME_RESULT" = success
          else
            echo "Documentation/CI-only change: Volta lane skipped"
          fi
