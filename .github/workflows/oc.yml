name: opencode (interactive)

# Interactive lane — complements the autonomous backlog worker (opencode.yml). This one
# runs the OFFICIAL opencode GitHub Action on `/oc` (or `/opencode`) comments, so it
# authenticates via the installed opencode app (OIDC token exchange) → its PRs/commits are
# APP-authored (trusted, no `action_required` gate). Use it for ad-hoc asks + PR review.
# The autonomous CUDA-self-verifying backlog fan stays on our custom opencode.yml.
#
# MODEL: defaults to deepseek-v4-flash (fast/cheap). Comment `/oc-pro ...` to escalate a
# task to deepseek-v4-pro (stronger) — used when flash has bounced off a task ~2x.
#
# SECURITY: owner-only trigger (public repo — untrusted comments must not run the agent).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write        # required for the opencode app OIDC token exchange

concurrency:
  group: oc-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >
      github.actor == github.repository_owner &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run opencode (DeepSeek via the app)
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: ${{ contains(github.event.comment.body, '/oc-pro') && 'deepseek/deepseek-v4-pro' || 'deepseek/deepseek-v4-flash' }}
