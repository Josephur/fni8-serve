name: OpenCode (DeepSeek)

# A second autonomous coding lane alongside Claude: comment "@deepseek <task>" on an
# issue, or add the "deepseek" label. deepseek-v4-pro drives `opencode run` on your
# self-hosted Volta runner (in the ci/opencode image, which has the host docker socket
# — so it BUILDS + TESTS the change itself), then pushes a branch and comments a PR
# link. Auto-loads AGENTS.md, MCP servers (context7 / sequential-thinking / brave).
#
# SECURITY: same posture as claude.yml — the `if:` guard hard-locks triggering to the
# repo OWNER only (this agent has API keys + GPU + the host docker socket).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]

concurrency:
  group: opencode-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@deepseek')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@deepseek') ||
           github.event.label.name == 'deepseek'))
      )
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run opencode (deepseek-v4-pro)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          docker run --rm \
            -e DEEPSEEK_API_KEY -e BRAVE_API_KEY -e HF_TOKEN -e GH_TOKEN \
            -e ISSUE_NUMBER -e ISSUE_TITLE -e ISSUE_BODY -e REPO -e BASE_BRANCH \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v /mnt/24tb:/mnt/24tb \
            opencode-deepseek:latest
