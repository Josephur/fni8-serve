name: Claude

# Lets you drive Claude Code from GitHub: comment "@claude <task>" on an issue or
# PR, assign an issue to Claude, or add the "claude" label. Claude works on your
# self-hosted Volta runner (so it can actually build/test the CUDA kernels in
# Docker), pushes a branch, and opens/updates a PR. It auto-loads this repo's
# CLAUDE.md / AGENTS.md, so the hardware rules, plan-mode-before-csrc, and TDD
# workflow are honored.
#
# SECURITY: this repo may be public and the runner is on your hardware. The `if:`
# guard below only lets OWNER / MEMBER / COLLABORATOR trigger a run — a stranger's
# comment can't spin up your GPU box. ALSO set Settings → Actions → "Fork pull
# request workflows from outside collaborators: Require approval for all external
# collaborators". See docs/CLAUDE-RUNNER-SETUP.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # HARD LOCK: only the repo OWNER can ever start a run. This agent has a live
    # HF token + GPU + the host docker socket, so `github.actor == repository_owner`
    # is the gate — no member/collaborator/fork-PR/outside contributor can trigger
    # it, regardless of @claude mention or label. (Also set repo Settings → Actions →
    # "Require approval for all outside collaborators" as defence-in-depth.)
    if: >
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') ||
           github.event.label.name == 'claude'))
      )
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        # Owner-only (see if: above), so the agent gets full capability: the HF token,
        # GPU visibility, and the /mnt/24tb weights archive — enough to drive forge
        # quant + benchmarks itself, not just author code.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          # Subscription auth (matches your local Claude Code sign-in). Generate the
          # long-lived token with `claude setup-token` and store it as this secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --- OR, if you use a console.anthropic.com API key instead, comment the
          # line above and uncomment: ---
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --add-dir mounts the weights archive into the agent's sandbox so it can
          # inspect/point at .fni8 files; nvidia-smi + forge/bench wrappers let it run
          # quant + on-cluster benchmarks. Only reachable because the trigger is
          # owner-locked above.
          claude_args: |
            --add-dir /mnt/24tb
            --allowedTools "Bash(docker compose:*),Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(trailmark:*),Bash(nvidia-smi:*),Bash(bash tools/forge.sh:*),Bash(bash tools/bench.sh:*),Bash(ls:*),Bash(cat:*),Edit,Read,Write,Glob,Grep"
