name: Claude

# Lets you drive Claude Code from GitHub: comment "@claude <task>" on an issue or
# PR, assign an issue to Claude, or add the "claude" label. Claude works on your
# self-hosted Volta runner (so it can actually build/test the CUDA kernels in
# Docker), pushes a branch, and opens/updates a PR. It auto-loads this repo's
# CLAUDE.md / AGENTS.md, so the hardware rules, plan-mode-before-csrc, and TDD
# workflow are honored.
#
# SECURITY: this repo may be public and the runner is on your hardware. The `if:`
# guard below only lets OWNER / MEMBER / COLLABORATOR trigger a run — a stranger's
# comment can't spin up your GPU box. ALSO set Settings → Actions → "Fork pull
# request workflows from outside collaborators: Require approval for all external
# collaborators". See docs/CLAUDE-RUNNER-SETUP.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Only trigger on @claude / assignment / "claude" label AND only from a
    # trusted author (owner / org member / collaborator).
    if: >
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
          (contains(github.event.issue.body, '@claude') ||
           github.event.label.name == 'claude'))
      )
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (matches your local Claude Code sign-in). Generate the
          # long-lived token with `claude setup-token` and store it as this secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --- OR, if you use a console.anthropic.com API key instead, comment the
          # line above and uncomment: ---
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(docker compose:*),Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(trailmark:*),Edit,Read,Write,Glob,Grep"
