name: Backlog Manager (DeepSeek)

# A deepseek-v4-pro agent that MANAGES this repo's backlog (not a coder): triages,
# keeps epics current, promotes unblocked rungs, dispatches ready work to the `deepseek`
# label, and maintains a "📋 Backlog status" dashboard issue. Owners interact by
# commenting "@manager <request>" on any issue. Runs autonomously on a schedule too.
#
# SECURITY: owner-locked for mentions; runs on the self-hosted runner in the ci/opencode
# image. Uses a broader PAT (GH_MANAGER_PAT) so it can read/coordinate across the sibling
# repos; falls back to the workflow token for its own repo.

on:
  workflow_run:                  # EVENT-DRIVEN: react the moment a PR's CI (or the kernel
    workflows: ["CI", "Kernel Reviewer (DeepSeek)"]
    types: [completed]           # reviewer) finishes → merge green PRs / promote immediately
  schedule:
    - cron: '*/15 * * * *'       # backstop tick (every 15 min) in case an event is missed
  issue_comment:
    types: [created]
  workflow_dispatch: {}          # manual trigger for validation

concurrency:
  group: manager-${{ github.repository }}
  cancel-in-progress: false

jobs:
  manage:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' &&
        github.actor == github.repository_owner &&
        contains(github.event.comment.body, '@manager') &&
        !contains(github.event.comment.body, 'backlog-manager'))
    runs-on: [self-hosted, volta-gpu]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run backlog manager (deepseek-v4-pro)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_MANAGER_PAT || github.token }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.event_name == 'issue_comment' && 'mention' || 'tick' }}
          MENTION_BODY: ${{ github.event.comment.body }}
          MENTION_ISSUE: ${{ github.event.issue.number }}
          MENTION_USER: ${{ github.event.comment.user.login }}
        run: |
          docker run --rm \
            -e DEEPSEEK_API_KEY -e BRAVE_API_KEY -e GH_TOKEN \
            -e REPO -e TRIGGER -e MENTION_BODY -e MENTION_ISSUE -e MENTION_USER \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint /usr/local/bin/run-manager.sh \
            opencode-deepseek:latest
